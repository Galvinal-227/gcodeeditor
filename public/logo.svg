<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Dark background -->
  <rect width="100" height="100" rx="16" fill="#1e1e1e"/>
  
  <!-- Code brackets besar -->
  <text x="50" y="45" font-family="'JetBrains Mono', monospace" font-size="28" font-weight="bold" text-anchor="middle" fill="#0e639c">{ }</text>
  
  <!-- GCE Text -->
  <text x="50" y="72" font-family="'JetBrains Mono', monospace" font-size="28" font-weight="bold" text-anchor="middle" fill="#e8ab53" letter-spacing="1">GCE</text>
  
  <!-- Small accent -->
  <line x1="30" y1="82" x2="70" y2="82" stroke="#858585" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>
</svg>